# Slackware slackpkg. Installed packages are read from `/var/log/packages`.
[[backend]]
name = "slackpkg"
os = "linux"
install_args = ["-batch=on", "-default_answer=y", "install"]
remove_args = ["-batch=on", "-default_answer=y", "remove"]
list_binary = "ls"
list_args = ["-1", "/var/log/packages"]
search_args = ["search"]
upgrade_args = ["-batch=on", "-default_answer=y", "upgrade-all"]
reads = "slackpkg"
searches = "slackpkg"
needs_root = true
is_exclusive = true
# Slackware does no dependency resolution: every installed package was chosen.
manual = "all_installed"

# Not a manager's output at all: `ls -1 /var/log/packages` lists Slackware's package
# database, one `name-version-arch-build` file per package. The last three dash-separated
# fields are the version, arch and build, so the name is everything before them — which is
# why a name containing dashes survives.
[backend.fixture]
source = "UNVERIFIED: written from Slackware's /var/log/packages naming convention; no Slackware image was reachable"
list = '''
vim-9.0.1-x86_64-1
aaa_base-15.0-x86_64-3
xorg-server-21.1.8-x86_64-1
'''
expect = [
    "vim",
    "aaa_base",
    "xorg-server",
]
