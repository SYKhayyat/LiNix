# Dart / pub, reached through `dart pub global`.
[[backend]]
name = "pub"
binary = "dart"
install_args = ["pub", "global", "activate"]
remove_args = ["pub", "global", "deactivate"]
list_args = ["pub", "global", "list"]
# pub.dev has no upgrade-all verb: re-activating each package unpinned is the upgrade. Upgradable
# without being searchable — pub.dev has no CLI search.
upgrade_reinstall_args = ["pub", "global", "activate"]
reads = "ws_name_version"
manual = "all_installed"
# pub pins with a trailing positional version — an operand, so `--` stays in front of both it and
# the name.
version_pin = { kind = "after", args = ["{version}"] }

# `name version`, one per line, with no header and no decoration.
[backend.fixture]
source = "docker dart:stable, `dart pub global activate http webdev` then `dart pub global list`, 2026-08-09"
list = '''
http 1.6.0
webdev 3.8.1
'''
expect = [
    "http@1.6.0",
    "webdev@3.8.1",
]

# asdf version manager. A tool/plugin is the "package"; installing pins a version.
[[backend]]
name = "asdf"
install_args = ["install"]
remove_args = ["uninstall"]
list_args = ["list"]
reads = "asdf"
manual = "all_installed"
# asdf refuses to install without a version, so an unpinned line asks for `latest`. Removal needs
# none: measured, `asdf uninstall nodejs` returns 0 and the version leaves `asdf list`.
version_pin = { kind = "after", args = ["{version}"], unpinned = "latest" }

# The plugin name is the package; the indented lines under it are the versions of that
# plugin, and a plugin with versions installed is one package, not one per version.
[backend.fixture]
source = "UNVERIFIED: written from asdf's documented `asdf list` layout; the git-clone install failed in an alpine container"
list = '''
nodejs
  20.11.0
python
  3.12.1
'''
expect = [
    "nodejs",
    "python",
]


# ---------------------------------------------------------------------------------------------
# Linux distribution managers that are pure argv. The rest of the Linux family — apt, dnf,
# pacman, apk, zypper, xbps — carry an orphan dry-run, a dependency probe or an essential-set
# reader whose parsers ARE rows too; they are here for the same reason the others are.
# ---------------------------------------------------------------------------------------------

# GNU Guix. Per-user, no root needed.
[[backend]]
name = "guix"
os = "linux"
install_args = ["install"]
remove_args = ["remove"]
# `guix package -I` lists the profile's manifest — what was explicitly installed — not the store
# closure behind it.
list_args = ["package", "-I"]
search_args = ["search"]
upgrade_args = ["upgrade"]
reads = "ws_name_version"
searches = "guix"
manual = "all_installed"
version_pin = { kind = "inline", template = "{name}@{version}" }

# Tab-separated `name version output store-path`. The third and fourth columns are the
# output name and the store path, and neither is a version.
[backend.fixture]
source = "UNVERIFIED: written from `guix package -I`'s documented four-column layout; no guix image was reachable"
list = '''
hello	2.12	out	/gnu/store/xxxx-hello-2.12
emacs	29.1	out	/gnu/store/yyyy-emacs-29.1
'''
expect = [
    "hello@2.12",
    "emacs@29.1",
]

# Gentoo Portage. Installed packages come from `qlist -I` (portage-utils).
[[backend]]
name = "emerge"
os = "linux"
install_args = ["--ask=n", "--quiet"]
remove_args = ["--unmerge", "--ask=n"]
list_binary = "qlist"
list_args = ["-I"]
search_args = ["--search"]
upgrade_args = ["--update", "--deep", "--newuse", "--ask=n", "@world"]
reads = "names_only"
searches = "emerge"
needs_root = true
is_exclusive = true

# `list_binary` is qlist, not emerge: portage has no listing verb and `qlist -I` is the one
# portage-utils ships for it. Category-qualified atoms, one per line, no versions.
[backend.fixture]
source = "UNVERIFIED: written from `qlist -I`'s documented output; gentoo/stage3 was not pulled"
list = '''
app-editors/vim
dev-lang/python
sys-apps/portage
'''
expect = [
    "app-editors/vim",
    "dev-lang/python",
    "sys-apps/portage",
]
# Portage's @world file is the explicit set; `emerge -I` lists the whole tree (306 packages vs an
# empty world on the gentoo test image). Wiring the world file is the right fix; until it is
# verified, adopt nothing.

