# The init/service systems LiNix ships (U36).
#
# Rows, not Rust — the same ruling that turned firewalls and settings stores into data. Each
# init is a name, a way to tell it is here (`detect` + optional `os`), and the argv for each
# action. A machine running s6, dinit, runit or GNU Shepherd adds a row to `adapters/init.toml`
# instead of waiting for a release; the shipped five go through the same loader so the built-ins
# exercise the path a user's row does.
#
# `{name}` is the service. Argv is a list, so a service name is one argument and never a place a
# shell could reach. systemd takes the unit as a trailing positional, so its rows carry `--`
# before `{name}`; every other init here puts the name between two positionals, where there is
# nowhere a terminator could go and each would read `--` as the service name.

[[init]]
name = "systemd"
os = "linux"
detect = "systemctl"
# `--no-pager` on every row, not only the two that print a screenful. systemctl decides to page
# from the terminal and from $SYSTEMD_PAGER, and a pager waits for a keypress that a captured
# child never receives — `linix status` hung there, on a read-only command.
enable  = [["systemctl", "--no-pager", "enable", "--", "{name}"]]
disable = [["systemctl", "--no-pager", "disable", "--", "{name}"]]
start   = [["systemctl", "--no-pager", "start", "--", "{name}"]]
stop    = [["systemctl", "--no-pager", "stop", "--", "{name}"]]
restart = [["systemctl", "--no-pager", "restart", "--", "{name}"]]
list = ["systemctl", "--no-pager", "list-units", "--type=service", "--state=running", "--no-legend"]
list_pattern = '^(\S+)'
list_strip_suffix = ".service"
status = ["systemctl", "--no-pager", "status", "--", "{name}"]
# `adopt --enabled-only`: the units this machine brings up itself, in one command rather than
# one `is-enabled` per unit. `--state=enabled` covers `enabled` and not `enabled-runtime`,
# which is a unit enabled until the next boot and so is not a decision about this machine.
list_enabled = ["systemctl", "--no-pager", "list-unit-files", "--type=service", "--state=enabled", "--no-legend"]
list_enabled_pattern = '^(\S+)\.service'


[[init]]
name = "openrc"
os = "linux"
detect = "rc-service"
enable  = [["rc-update", "add", "{name}", "default"]]
disable = [["rc-update", "del", "{name}", "default"]]
start   = [["rc-service", "{name}", "start"]]
stop    = [["rc-service", "{name}", "stop"]]
restart = [["rc-service", "{name}", "restart"]]
list = ["rc-status", "--servicelist"]
list_pattern = '^\s*(\S+)'
status = ["rc-service", "{name}", "status"]
# OpenRC's boot decision is the runlevel a service is added to.
list_enabled = ["rc-update", "show", "default"]
list_enabled_pattern = '^\s*(\S+)'


[[init]]
name = "sysvinit"
os = "linux"
detect = "service"
enable  = [["update-rc.d", "{name}", "enable"]]
disable = [["update-rc.d", "{name}", "disable"]]
start   = [["service", "{name}", "start"]]
stop    = [["service", "{name}", "stop"]]
restart = [["service", "{name}", "restart"]]
status = ["service", "{name}", "status"]

[[init]]
name = "launchd"
os = "macos"
detect = "launchctl"
enable  = [["launchctl", "load", "-w", "{name}"]]
disable = [["launchctl", "unload", "-w", "{name}"]]
start   = [["launchctl", "start", "{name}"]]
stop    = [["launchctl", "stop", "{name}"]]
# No native restart verb. Spelled out here as stop-then-start it was indistinguishable from a
# native one, so both halves were labelled `restart` and neither could be told which codes mean
# "already in that state". Left absent, the derivation produces the same two commands and labels
# each with its own verb.
list = ["launchctl", "list"]
list_pattern = '^\S+\s+\S+\s+(\S+)'
list_skip_lines = 1

[[init]]
name = "windows-sc"
os = "windows"
detect = "sc"
enable  = [["sc", "config", "{name}", "start=", "auto"]]
disable = [["sc", "config", "{name}", "start=", "disabled"]]
start   = [["sc", "start", "{name}"]]
stop    = [["sc", "stop", "{name}"]]
# `sc` has no restart verb either — see launchd above for why it is not written out here.
# 1056 = ERROR_SERVICE_ALREADY_RUNNING, 1062 = ERROR_SERVICE_NOT_ACTIVE. `sc` returns them for
# a start of a running service and a stop of a stopped one — the state the declaration asked
# for. Without these, adopting a machine's running services makes every later sync fail on the
# first one.
start_benign_exits = [1056]
stop_benign_exits  = [1062]
# `state= active` is what sc's own documentation says and what this box rejects:
#   sc query type= service state= active   ->  ERROR: Invalid state= field   (exit 0)
#   sc query type= service                 ->  156 services
# Measured on Windows 11 26200. `sc query` already answers about ACTIVE services by default,
# so the rejected argument was asking for the behaviour it already had — and because `sc`
# exits 0 while printing `ERROR:`, `linix list -b service` returned an empty list rather than
# a failure, on every Windows machine, since this row was written.
list = ["sc", "query", "type=", "service"]
list_pattern = 'SERVICE_NAME:\s+(\S+)'
# `adopt --enabled-only`. `sc` has no verb that lists start types, and asking per service is a
# process spawn each -- 150 of them on the host this was measured on. PowerShell answers the
# whole question once. `Automatic` covers `Automatic (Delayed Start)`, which is the same
# decision made about the same service; a trigger-start service is deliberately excluded,
# because Windows stopping it again when it idles is exactly what made adopting them wrong.
list_enabled = ["powershell", "-NoProfile", "-Command", "Get-Service | Where-Object { $_.StartType -eq 'Automatic' } | ForEach-Object { 'SERVICE_NAME: ' + $_.Name }"]

status = ["sc", "qc", "{name}"]
