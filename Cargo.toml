[package]
name = "linix"
version = "3.0.0"
edition = "2021"
authors = ["LiNix Contributors"]
description = "Universal package manager with multi-backend support"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"

# CLI
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
dialoguer = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Parallelism
rayon = "1.8"

# Lua scripting
mlua = { version = "0.9", features = ["lua54", "vendored", "async"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }

# File system
walkdir = "2.4"
tempfile = "3.8"
dirs = "5.0"

# Rate limiting
governor = "0.6"
nonzero_ext = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Progress bars
indicatif = "0.17"

# Utilities
regex = "1.10"
once_cell = "1.19"
hostname = "0.3"

# Platform detection
cfg-if = "1.0"

# Additional utilities
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"

zip = "0.6"
tar = "0.4"
flate2 = "1.0"

# Unix-specific
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
mockall = "0.12"
tempfile = "3.8"
tokio-test = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true