[package]
name = "linix"
version = "0.7.0"
edition = "2021"
authors = ["LiNix Contributors"]
description = "Universal Mission-Critical Package Manager with DAG-based parallel execution"

[dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.35", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "io-util",
    "io-std",
    "net",
    "sync",
    "time",
    "signal",
] }
async-trait = "0.1"
futures = "0.3"
dashmap = "5.5" # Thread-safe LockMap implementation
tokio-util = { version = "0.7", features = ["rt"] }

# Graph Theory & Execution Planning
petgraph = "0.6" # DAG support

# CLI & Configuration
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
clap_complete_nushell = "4.4" # NuShell completion generator (lives outside clap_complete core)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0" # Added for Feature 1 (JSON Reporting)
toml = "0.8"
dirs = "5.0"
hostname = "0.3"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Scripting & Templating
mlua = { version = "0.9", features = ["lua54", "vendored", "async"] }
rhai = { version = "1.15", features = ["sync"] }
tera = "1.19" 

# Networking & API Integration
# rustls (not native-tls) so we don't drag in OpenSSL — that made static musl/Alpine
# builds fail to link and required openssl-dev on every distro. lettre already uses rustls.
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Rate limiting. Without `quanta`: its clock calibrates the TSC on first construction, which
# measured 200ms, once, on whichever thread got there first — a fifth of a second on `linix path`
# for a GitHub API budget it never spends. `MonotonicClock` (std `Instant`) resolves to
# nanoseconds, and the fastest quota here is 80 requests per MINUTE.
governor = { version = "0.6", default-features = false, features = ["std", "jitter"] }
nonzero_ext = "0.3"

# System Utilities & Persistence
walkdir = "2.4"
tempfile = "3.8"
regex = "1.10"
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10" 
hex = "0.4"
fs2 = "0.4"   # Process-level advisory file locking
md5 = "0.7"
which = "6.0"
libc = "0.2"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Archive Support
tar = "0.4"
flate2 = "1.0"
zip = "0.6"
xz2 = "0.1"
bzip2 = "0.4"

# Versioning Logic
semver = "1.0"
version-compare = "0.1"

# Logging & Monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17" # Progress bars

# UI & Interaction
dialoguer = "0.11"
ratatui = "0.24"  
crossterm = "0.27"

# --- NEW FOR 3.6.0 ---

# Feature 5: Native Scheduling & Logic
cron = "0.12"      # Cron expression parsing for schedules
itertools = "0.12" # Advanced iteration for planning filtering

# Feature 5: Notifications
notify-rust = "4.10" # Desktop notifications (Linux/macOS/Windows)
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "hostname", "tracing"] }
# Platform-Specific Dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "processthreadsapi", 
    "securitybaseapi", 
    "winnt", 
    "handleapi", 
    "winbase", 
    "fileapi", 
    "shlobj"
] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true