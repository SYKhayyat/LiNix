[package]
name = "linix"
version = "3.5.0"  # Bump version for fixes
edition = "2021"
authors = ["LiNix Contributors"]
description = "Universal Mission-Critical Package Manager with DAG-based parallel execution"

[dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
dashmap = "5.5" # Thread-safe LockMap implementation for fine-grained locking
rayon = "1.8"   # Parallel iterators for CPU-bound tasks

# Graph Theory & Execution Planning (Phase 2.2)
petgraph = "0.6" # Directed Acyclic Graph (DAG) support for dependencies

# CLI & Configuration
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dirs = "5.0"
hostname = "0.3"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Scripting & Templating (Phase 4 Prep)
mlua = { version = "0.9", features = ["lua54", "vendored", "async"] }
rhai = { version = "1.15", features = ["sync"] } # Performant Rust-native scripting
tera = "1.19" # Modern Jinja2-style templating engine for dotfiles

# Networking & API Integration
reqwest = { version = "0.11", features = ["json", "stream"] }
governor = "0.6"      # Rate limiting for GitHub and Marketplace APIs
nonzero_ext = "0.3"

# System Utilities & Persistence
walkdir = "2.4"
tempfile = "3.8"
regex = "1.10"
once_cell = "1.19"
chrono = "0.4"
sha2 = "0.10" # Security: Checksum verification (SHA256)
hex = "0.4"
fs2 = "0.4"   # Process-level advisory file locking for package managers
md5 = "0.7"
which = "6.0"
libc = "0.2"
uuid = { version = "1.6", features = ["v4", "serde"] }  # FIX #5: Add UUID for journal entries

# Archive Support (Recursive Extraction for Web/Github backends)
tar = "0.4"
flate2 = "1.0"
zip = "0.6"
xz2 = "0.1"
bzip2 = "0.4"

# Versioning Logic
semver = "1.0"
version_compare = "0.1"

# Logging & Monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17" # Professional progress bars and spinners

# UI & Interaction
dialoguer = "0.11"
ratatui = "0.24"  # Added for TUI support
crossterm = "0.27"  # Added for TUI support

tokio-util = { version = "0.7", features = ["rt"] }

# Platform-Specific Dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "securitybaseapi", "winnt", "handleapi", "winbase", "fileapi"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true