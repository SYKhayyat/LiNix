[package]
name = "linix"
version = "3.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
mlua = { version = "0.9", features = ["lua54", "vendored", "async"] }
reqwest = { version = "0.11", features = ["json"] }
walkdir = "2.4"
tempfile = "3.8"
dirs = "5.0"
governor = "0.6"
nonzero_ext = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
regex = "1.10"
once_cell = "1.19"
hostname = "0.3"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
tar = "0.4"
flate2 = "1.0"
zip = "0.6"
xz2 = "0.1"
bzip2 = "0.4"
which = "6.0"
dialoguer = "0.11"
fs2 = "0.4" # Added for Inter-process locking
md5 = "0.7" # Added for Web storage IDs
libc = "0.2"
winapi = { version = "0.3", features = ["processthreadsapi", "securitybaseapi", "winnt", "handleapi"] }