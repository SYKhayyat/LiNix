[package]
name = "linix"
version = "0.7.0"
edition = "2021"
# The oldest toolchain this is known to build on.
#
# **Not a guess and not aspirational.** Before this there was none, which means the answer to
# "will this build on my machine" was whatever the author's rustup happened to have — and a
# contributor on a distro-packaged Rust found out by watching it fail. The number moves when a
# change needs it to, deliberately and in a commit that says why; it does not drift.
rust-version = "1.89"
authors = ["LiNix Contributors"]
# Not publishable until `Z1` (the licence) is ruled: crates.io refuses a package with no `license`
# key, so this states today's truth rather than a preference. It is also what lets `deny.toml`
# skip the licence check on our own crate without answering `Z1` by implication.
publish = false
description = "Universal Mission-Critical Package Manager with DAG-based parallel execution"

[dependencies]
# Async Runtime & Concurrency
tokio = { version = "1.35", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "io-util",
    "io-std",
    "net",
    "sync",
    "time",
    "signal",
] }
async-trait = "0.1"
futures = "0.3"
dashmap = "5.5" # Thread-safe LockMap implementation
tokio-util = { version = "0.7", features = ["rt"] }

# Graph Theory & Execution Planning
petgraph = "0.6" # DAG support

# CLI & Configuration
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
clap_complete_nushell = "4.4" # NuShell completion generator (lives outside clap_complete core)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0" # Added for Feature 1 (JSON Reporting)
toml = "0.8"
dirs = "5.0"
hostname = "0.3"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Scripting & Templating
mlua = { version = "0.9", features = ["lua54", "vendored", "async"] }
rhai = { version = "1.15", features = ["sync"] }
tera = "1.19" 

# Networking & API Integration
# rustls (not native-tls) so we don't drag in OpenSSL — that made static musl/Alpine
# builds fail to link and required openssl-dev on every distro.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# Rate limiting. Without `quanta`: its clock calibrates the TSC on first construction, which
# measured 200ms, once, on whichever thread got there first — a fifth of a second on `linix path`
# for a GitHub API budget it never spends. `MonotonicClock` (std `Instant`) resolves to
# nanoseconds, and the fastest quota here is 80 requests per MINUTE.
governor = { version = "0.6", default-features = false, features = ["std", "jitter"] }

# System Utilities & Persistence
walkdir = "2.4"
tempfile = "3.8"
regex = "1.10"
once_cell = "1.19"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10" 
hex = "0.4"
fs2 = "0.4"   # Process-level advisory file locking
md5 = "0.7"
which = "6.0"
libc = "0.2"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Archive Support
tar = "0.4"
flate2 = "1.0"
zip = "0.6"
xz2 = "0.1"
bzip2 = "0.4"
# Already in the tree as a transitive dependency of `zip`; named here because
# `Format` offers `.tar.zst` and the extractor has to be able to open what the selector
# chooses. Pinned to the version already resolved, so this adds no build.
zstd = "0.11"

# Versioning Logic
semver = "1.0"
version-compare = "0.1"

# Logging & Monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18" # Progress bars

# UI & Interaction
dialoguer = "0.11"
ratatui = "0.30"
# crossterm is NOT a direct dependency: it is reached through `ratatui::crossterm`.
# Declaring it here is how the tree ended up with 0.27 under `src/app/ui/` and 0.28 under
# ratatui, two key-event parsers on one stdin, agreeing only by luck.

# --- NEW FOR 3.6.0 ---

# Feature 5: Native Scheduling & Logic
cron = "0.12"      # Cron expression parsing for schedules

# Feature 5: Notifications
# Platform-Specific Dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "processthreadsapi", 
    "securitybaseapi", 
    "winnt", 
    "handleapi", 
    "winbase", 
    "fileapi", 
    "shlobj"
] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true