# LiNix preferences.toml — refusals and behaviour (II.1). Nothing writes to this but you.
#
# Copy this to your repo root (see `linix path`) as preferences.toml and modify as needed.
# Every key is optional. An unknown key is an error, not a shrug — see `deny_unknown_fields`.
#
# Where your repo lives is NOT a key here: this file is inside it. Use `linix path --set`.

# Dry-run mode: Show what would happen without making actual system changes.
dry_run = false

# Skip confirmation prompts for automated workflows.
yes = false

# Which backends this host uses, and in what order, live in the `priority` file (II.6),
# NOT here — one list, with `when` blocks for the per-host case. Your repo root (holding
# modules/, profiles/, active, priority) is $LINIX_CONFIG_DIR or the platform config dir.

# How many PROCESSES LiNix runs at once — the install/remove transaction engine's DAG
# concurrency, the per-backend probes, the dependency queries. Defaults to the core count.
#
# Note that packages going to the same manager in the same wave now share ONE command line
# (II.19), so this is a cap on how many *managers* are working at once far more often than
# it is a cap on packages.
max_parallel = 8

# How many NETWORK REQUESTS LiNix has in flight at once — registry searches, the priority
# chain's remote lookups, advisory fetches, SSH to a fleet. A separate number because
# nothing about waiting on a socket is bounded by how many cores you have: on a four-core
# machine this used to run `search`'s ~22 registry queries in six sequential waves.
# Defaults to 16 whatever the core count.
network_parallel = 16

# Timeout (in seconds) for outbound HTTP search requests
# (npm/pnpm/yarn registry, PyPI for pip, the VS Code marketplace).
network_timeout_secs = 15

# How long a spawned command may produce NO output at all before LiNix kills it and names
# it. This bounds silence, not duration — a compile that prints for an hour is never
# touched, while a manager that has stopped talking and stopped exiting is. 0 removes the
# bound, which is what LiNix did before: an uninstall once sat 76 minutes on a Windows
# restore point that had already been written.
command_idle_timeout_secs = 900

# The same cap on silence, for a READ — a listing, a search, an existence probe. Separate
# because the number above is sized for a mutation that legitimately runs silent for minutes
# (a Windows restore point), while a read takes seconds: `winget list` is 1.5s here, 2.6s
# under heavy contention. One number for both meant a wedged listing cost fifteen minutes to
# learn what two could have told you. 0 removes it; anything above the bound above is moot.
query_idle_timeout_secs = 120

# How many times a read whose failure is classified TRANSIENT is asked again. 1 disables it.
# Reads only, and that is the justification: asking a manager what it has, twice, costs a
# second, while a mutation retried on a guess installs something twice. Measured: winget
# loses ~3 of a cold burst of 16 concurrent listings and none of the next 32.
read_retry_attempts = 3

# How long to wait out a remote rate limit (GitHub) before giving up and naming the host
# and its reset time. The wait is taken while the data directory is locked, so a long one
# is indistinguishable from a hang; raise it for an unattended job that would rather wait.
rate_limit_max_wait_secs = 30

# Retention window passed to `nix-collect-garbage --delete-older-than` when cleaning
# Nix orphans (e.g. "30d", "2w"). Replaces the previously hardcoded 30 days.
nix_gc_age = "30d"

# K4: when a github:/web:/appimage: package is removed, also delete any cached copy of the
# fetched file. Download-backends only — apt/dnf/pacman manage their own caches.
# clean_cache_on_remove = false
# cache_dirs = ["/opt/downloads"]

# Default SSH destinations for `linix fleet` when none are passed on the command line.
# fleet_hosts = ["user@web-01", "user@web-02"]

# Show professional progress indicators and spinners.
show_progress = true

# Enable verbose logging for debugging.
verbose = false

# The [guard] table (II.10): the nine refusals, one home. Protected packages,
# the removal/install ceilings, and the install/change rules all live here.
[guard]
# Packages LiNix will never remove, ADDED to the built-in list. These are
# critical system packages; add or remove as needed for your distribution.
protected_packages = [
    "sudo", "bash", "linix",
    "linux-image", "linux-headers", "kernel",
    "systemd", "libc6", "glibc",
    "grub", "coreutils", "filesystem",
    "apt", "pacman", "dnf", "rpm"
]
# max_removals = 20        # refuse removing more than this many PACKAGES at once (0 = off)
# max_extra_removals = 20  # the same, for link:/service:/setting:/shim:/schedule:/repo:
#                          # teardowns and firewall ports. Its own budget (Y20).
# max_installs = 500       # refuse installing more than this at once (0 = off, default)
# deny_packages = ["leftpad"]
# pinned_only = false      # every install must carry an explicit @version=
# require_snapshot = false # refuse to change anything unless a snapshot can be taken
# deny_vulnerable = false  # refuse to apply when `linix check security` flags a managed package
# confine_bin = true       # refuse a downloaded file a destination outside the backend's
                           # bin directory (SEC1). Not one of the nine: it is checked where
                           # a backend deploys, which is the only place that path exists.
# require_signed_history = false
                           # refuse to roll back to a commit git does not vouch for (II.13).
                           # Off by default: a fresh repo signs nothing. Turn it on together
                           # with `git config commit.gpgsign true`.
# never_unattended = ["rebuild", "purge-undeclared"]
                           # commands a `schedules` entry may not run, matched against the
                           # first word of `run =`. Both remove declared software, and a
                           # timer fires with nobody there to read a refusal. Take a name
                           # out to permit it here.

# Backend Aliases
[aliases]
sys = "apt"
web = "web"
ext = "vscode"

# Per-host packages live in a module with a `when host == ...` block, not here.
# Per-host backend sets live in the `priority` file with `when` blocks, e.g.
#   when host == server-01
#   apt
#   end
# — keeping dev tooling off a server without a second place to say which backends exist.

# Managed config files are declared with a `link:` line in a module, not here — a file you
# want on this machine is a declaration, and declarations live in modules/ (II.1).

# Retention: how long to keep filesystem snapshots. Rules combine as a UNION — a snapshot
# is kept if it matches ANY rule — and the single most-recent one is always kept, so a
# policy can never leave you with nothing to roll back to.
#   keep_last  — keep the N newest
#   keep_days  — keep anything younger than N days
#   keep       — always keep these ids/labels (pins)
# Snapshots are the only history with a retention policy: manifest history is git, and
# `linix rollback` is `git checkout` + sync, so git decides how much of it there is.
[retention.snapshots]
# keep_last = 10
# keep_days = 30
# keep = ["known-good-2026-07"]

# Scripting hooks. The first line picks the language:
#   `#!/bin/sh` (any shebang) — run as a process, like any other script
#   `#rhai`                   — Rhai, in-process
#   anything else             — Lua, in-process
# All three are handed PKG_NAME, HOOK_TYPE, OS and ARCH (a shebang gets them as LINIX_*), and
# every one of them is hashed into locks/ — `linix lock` approves, and a changed script stops
# the next sync until you approve it again.
#
# A shebang works on Windows too: LiNix reads that first line itself rather than handing the file
# to an OS that has no shebang mechanism, so `#!/usr/bin/env python3` runs your Python everywhere
# (looked up as python3, then python, then py). What it cannot conjure is an interpreter the
# machine does not have — `#!/bin/sh` needs a shell on PATH, which a stock Windows box has not
# got. `#rhai` and Lua need no interpreter at all and run wherever LiNix does.
[hooks.before_install]
"*" = '''
print("Starting installation of " .. PKG_NAME)
'''

[hooks.after_install]
docker = '''
#rhai
print("Enabling Docker system service via Rhai...");
sh("systemctl enable docker");
sh("systemctl start docker");
'''

[hooks.before_sync]
"*" = "print('LiNix is calculating system delta...')"

# Backend-Specific Settings
[backend_settings.flatpak]
scope = "user"

[backend_settings.github]
# token = "ghp_your_personal_access_token_for_higher_limits"

[backend_settings.npm]
# registry = "https://registry.npmjs.org"

[backend_settings.pip]
# index_url = "https://pypi.org/simple"

[backend_settings.conda]
# Conda is environment-scoped: LiNix operates on this environment for
# install/remove/list/upgrade. Defaults to "base" when unset.
# env = "base"

# ---------------------------------------------------------------------------
# Onboarding your own package managers (the "onboarder")
# ---------------------------------------------------------------------------
# LiNix can learn any CLI-based package manager with no source changes. Define
# backends declaratively in `adapters/backends.toml` in this repo — it travels
# with the config, or a line using it fails on every machine but the one where
# you wrote the file. Its siblings are `adapters/settings.toml` (how to drive a
# settings store) and `adapters/bootstrap.toml` (how to obtain a manager).
#
# Each file is argv this repo can run on any machine that clones it, so each goes
# through the same approval a hook does: `linix lock` approves them, and an edit
# stops that file loading until you approve it again. Files are approved
# separately — approving one is not a review of another.
#
# They are loaded last and can never override a built-in backend. Example:
#
#   [[backend]]
#   name = "paru"                        # the prefix a line is written with
#   # binary = "paru"                    # the program run; defaults to `name`
#   install_args = ["-S", "--noconfirm"]
#   remove_args  = ["-R", "--noconfirm"]
#   list_args    = ["-Qm"]
#   search_args  = ["-Ss"]
#   upgrade_args = ["-Syu", "--noconfirm"]
#   needs_root   = false
#   is_exclusive = true
#   [backend.parser]                     # how to read `list` output
#   format = "columns"                   # lines | columns | json | regex
#   name_col = 0
#   version_col = 1
#   [backend.search_parser]              # optional; defaults to [backend.parser]
#   format = "columns"
#   name_col = 0
#   version_col = 1