# LiNix Configuration File
# 
# This is an example configuration file for LiNix.
# Copy this to ~/.config/linix/config.toml and modify as needed.

# Dry-run mode (don't make actual changes)
dry_run = false

# Skip confirmation prompts
yes = false

# Directory containing package group files
groups_dir = "./examples/groups"

# Enabled backends (empty = all available)
# enabled_backends = ["apt", "flatpak", "cargo"]
enabled_backends = []

# Path to bloatware file (packages to remove)
bloatware_file = "./examples/bloatware.txt"

# Remove bloatware on sync
remove_bloatware = false

# Show progress indicators
show_progress = true

# Verbose output
verbose = false

# Cache TTL in seconds
cache_ttl = 300

# GitHub personal access token for higher rate limits
# Uncomment and add your token for increased API limits
# github_token = "ghp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# Maximum parallel operations
max_parallel = 4

# Hostname-specific packages
# Packages listed under your hostname will be installed only on that machine
[hostname_packages]
# my-desktop = ["steam", "discord", "nvidia-driver"]
# my-laptop = ["powertop", "tlp", "brightness-controller"]
# workstation = ["docker", "kubernetes-cli", "terraform"]

# Hooks - Lua scripts that run before/after package operations
# Available hooks: before_install, after_install, before_remove, after_remove
