# LiNix Configuration File - Version 3.5.0 (High-Performance Engine)
# 
# Copy this to ~/.config/linix/config.toml and modify as needed.

# Dry-run mode: Show what would happen without making actual system changes.
dry_run = false

# Skip confirmation prompts for automated workflows.
yes = false

# Which backends this host uses, and in what order, live in the `priority` file (II.6),
# NOT here — one list, with `when` blocks for the per-host case. Your repo root (holding
# modules/, profiles/, active, priority) is $LINIX_CONFIG_DIR or the platform config dir.

# Maximum number of parallel operations. Now drives the install/remove transaction
# engine (DAG concurrency) as well as parallel search — not just search.
max_parallel = 8

# Timeout (in seconds) for outbound HTTP search requests
# (npm/pnpm/yarn registry, PyPI for pip, the VS Code marketplace).
network_timeout_secs = 15

# Retention window passed to `nix-collect-garbage --delete-older-than` when cleaning
# Nix orphans (e.g. "30d", "2w"). Replaces the previously hardcoded 30 days.
nix_gc_age = "30d"

# Require an extra confirmation before destructive (removal) operations,
# unless `yes = true`.
confirm_destructive = false

# Cache TTL (Time-to-Live) in seconds for remote metadata lookups.
cache_ttl = 300

# Drift-removal scope for `prune`/`sync`:
#   "managed" (default) — only remove packages LiNix manages that left the manifests.
#   "system"            — remove ANY installed package not in your manifests (except
#                         protected packages). Powerful and dangerous; enable deliberately.
prune_scope = "managed"

# Shield imperatively-installed packages (`linix install ...`) from drift pruning even if
# they never made it into a manifest. Safe default: true.
protect_imperative = true

# Default SSH destinations for `linix fleet` when none are passed on the command line.
# fleet_hosts = ["user@web-01", "user@web-02"]

# Source of truth for packages to remove (bloatware).
bloatware_file = "~/.config/linix/bloatware.txt"
remove_bloatware = false

# Whether `sync` removes drift (packages installed but no longer in your manifests).
# Default false — `sync` only installs/upgrades, and drift is removed explicitly with
# `linix prune` (preview it first with `linix status`). Set true to prune during sync.
prune_on_sync = false

# Show professional progress indicators and spinners.
show_progress = true

# Enable verbose logging for debugging.
verbose = false

# The [guard] table (II.10): the nine refusals, one home. Protected packages,
# the removal/install ceilings, and the install/change rules all live here.
[guard]
# Packages LiNix will never remove, ADDED to the built-in list. These are
# critical system packages; add or remove as needed for your distribution.
protected_packages = [
    "sudo", "bash", "linix",
    "linux-image", "linux-headers", "kernel",
    "systemd", "libc6", "glibc",
    "grub", "coreutils", "filesystem",
    "apt", "pacman", "dnf", "rpm"
]
# max_removals = 20        # refuse removing more than this at once (0 = off)
# max_installs = 500       # refuse installing more than this at once (0 = off, default)
# deny_packages = ["leftpad"]
# pinned_only = false      # every install must carry an explicit @version=
# require_snapshot = false # refuse to change anything unless a snapshot can be taken
# deny_vulnerable = false  # refuse to apply when `linix audit` flags a managed package

# Backend Aliases
[aliases]
sys = "apt"
web = "web"
ext = "vscode"

# Hostname-specific packages
[hostname_packages]
# workstation = ["docker", "kubernetes-cli", "terraform"]
# gaming-pc = ["steam", "discord", "nvidia-settings"]

# Per-host backend sets now live in the `priority` file with `when` blocks, e.g.
#   when host == server-01
#   apt
#   end
# — keeping dev tooling off a server without a second place to say which backends exist.

# Managed config files, contents declared inline (target path -> file body).
# Each becomes a managed `link` file: written on `sync`, self-healed if edited, tracked
# for drift, and removed by `prune` when you delete the entry. Any pre-existing file at
# the target is backed up once to "<target>.linix-backup" before it is overwritten, and
# LiNix logs where the backup went. (To point at a separate source file instead, use a
# `link:` line in a manifest; to fill in per-machine values, use a link template.)
[managed_files]
# "~/.gitconfig" = '''
# [user]
#     name = Ada Lovelace
#     email = ada@example.com
# [init]
#     defaultBranch = main
# '''

# Retention: how long to keep each of LiNix's three histories. Each block is independent
# (they cost very different amounts of disk). Rules combine as a UNION — an entry is kept
# if it matches ANY rule — and the single most-recent entry is always kept. An empty
# block keeps everything.
#   keep_last  — keep the N newest
#   keep_days  — keep anything younger than N days
#   keep       — always keep these ids/labels (pins)
[retention.generations]
# keep_last = 50
# keep_days = 90
# keep = ["known-good-2026-07"]

[retention.snapshots]
# keep_last = 5
# keep_days = 30

[retention.manifests]
# keep_last = 100

# Scripting Hooks (Phase 4.1)
[hooks.before_install]
"*" = '''
print("Starting installation of " .. PKG_NAME)
'''

[hooks.after_install]
docker = '''
#rhai
print("Enabling Docker system service via Rhai...");
exec("systemctl enable docker");
exec("systemctl start docker");
'''

[hooks.before_sync]
"*" = "print('LiNix is calculating system delta...')"

# Backend-Specific Settings
[backend_settings.flatpak]
user = "true"

[backend_settings.github]
# token = "ghp_your_personal_access_token_for_higher_limits"

[backend_settings.npm]
# registry = "https://registry.npmjs.org"

[backend_settings.pip]
# index_url = "https://pypi.org/simple"

[backend_settings.conda]
# Conda is environment-scoped: LiNix operates on this environment for
# install/remove/list/upgrade. Defaults to "base" when unset.
# env = "base"

# ---------------------------------------------------------------------------
# Onboarding your own package managers (the "onboarder")
# ---------------------------------------------------------------------------
# LiNix can learn any CLI-based package manager with no source changes. Define
# backends declaratively in a SEPARATE file, ~/.config/linix/custom_backends.toml.
# They are loaded last and can never override a built-in backend. Example:
#
#   [[backend]]
#   name = "paru"                        # also the invoked binary
#   install_args = ["-S", "--noconfirm"]
#   remove_args  = ["-R", "--noconfirm"]
#   list_args    = ["-Qm"]
#   search_args  = ["-Ss"]
#   upgrade_args = ["-Syu", "--noconfirm"]
#   needs_root   = false
#   is_exclusive = true
#   [backend.parser]                     # how to read `list` output
#   format = "columns"                   # lines | columns | json | regex
#   name_col = 0
#   version_col = 1
#   [backend.search_parser]              # optional; defaults to [backend.parser]
#   format = "columns"
#   name_col = 0
#   version_col = 1