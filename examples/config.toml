# LiNix Configuration File - Version 3.2.0 (High-Performance Engine)
# 
# Copy this to ~/.config/linix/config.toml and modify as needed.

# Dry-run mode: Show what would happen without making actual system changes.
dry_run = false

# Skip confirmation prompts for automated workflows.
yes = false

# Directory containing your declarative package group files (.txt).
groups_dir = "~/.config/linix/groups"

# Priority order for universal package discovery.
# When a package name is ambiguous, LiNix checks these backends in order.
backend_priority = ["apt", "pacman", "dnf", "winget", "brew", "flatpak", "snap", "cargo", "npm", "pip"]

# Maximum number of parallel operations (Phase 2.3).
# Adjust this based on your network bandwidth and CPU cores.
max_parallel = 8

# Cache TTL (Time-to-Live) in seconds for remote metadata lookups.
cache_ttl = 300

# Whitelist of enabled backends (empty = all available discovered binaries).
enabled_backends = []

# Source of truth for packages to remove (bloatware).
bloatware_file = "~/.config/linix/bloatware.txt"
remove_bloatware = false

# Show professional progress indicators and spinners.
show_progress = true

# Enable verbose logging for debugging.
verbose = false

# Default backend to use when no prefix is provided (e.g. "curl" vs "apt:curl").
default_backend = "apt"

# Backend Aliases
[aliases]
sys = "apt"
web = "web"
ext = "vscode"

# Hostname-specific packages
# Packages listed here will only be installed on the machine with the matching hostname.
[hostname_packages]
# workstation = ["docker", "kubernetes-cli", "terraform"]
# gaming-pc = ["steam", "discord", "nvidia-settings"]

# Scripting Hooks (Phase 4.1)
# Supports Lua (default) and Rhai (start script with '#rhai').
[hooks.before_install]
# Catch-all hook for any package installation
"*" = '''
print("Starting installation of " .. PKG_NAME)
'''

[hooks.after_install]
# High-performance Rhai hook for Docker
docker = '''
#rhai
print("Enabling Docker system service via Rhai...");
exec("systemctl enable docker");
exec("systemctl start docker");
'''

[hooks.before_sync]
# Custom logic before starting a DAG-based sync
"*" = "print('LiNix is calculating system delta...')"

# Backend-Specific Settings
[backend_settings.flatpak]
user = "true"  # Install Flatpaks in the user scope instead of system-wide

[backend_settings.github]
# token = "ghp_your_personal_access_token_for_higher_limits"

[backend_settings.npm]
# registry = "https://registry.npmjs.org"

[backend_settings.pip]
# index_url = "https://pypi.org/simple"