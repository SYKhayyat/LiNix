name: CI

on:
  push:
    branches: [ main ]
    # **Without this line the `release` job below cannot ever run.** It is gated on
    # `refs/tags/v*`, and a workflow that does not listen for tag pushes is never started by
    # one — so the tag would be pushed, nothing would happen, and the missing release would
    # look like a missing tag. Two releases were named in `CHANGELOG.md` and neither was
    # published; this is the half of that nobody had looked at.
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
  # The slow images and the macOS sweep are the broad half of the coverage, and coverage
  # that only runs when somebody remembers to press a button is coverage nobody consults.
  # Nightly, because V.57's objection — a slow gate teaches people to skip it — is about
  # gating every push, not about running at 03:00.
  schedule:
    - cron: '0 3 * * *'

# One in-flight run per ref per trigger, and the superseded one is cancelled.
#
# Every push fans out ~25 jobs across three macOS and two Windows runners. With nothing here,
# six runs sat QUEUED for between fourteen and eighteen hours behind each other — including a
# `workflow_dispatch` — so the question "is `main` green?" had no answer at all: some of main's
# runs had never started. A queue that never drains is not a slow gate, it is an absent one.
#
# **The trigger is part of the group on purpose.** A push and the nightly schedule share
# `refs/heads/main`, so grouping on the ref alone would let an afternoon push cancel the 03:00
# run — and the nightly is where the container matrix, the macOS sweep and the argv-drift probe
# live. That would delete the broad half of the coverage to speed up the narrow half.
#
# **A tag is never cancelled.** A tagged run publishes binaries; half a release is worse than no
# release. And `schedule` is never cancelled either: the nightly is the broad coverage, and a
# dispatch or a push must not be able to delete it.
#
# **A dispatch cancels an older dispatch**, which the first version of this got wrong on the
# reasoning that a manual rehearsal should not be killed. A rehearsal superseded by a newer
# rehearsal on the same ref is stale by exactly the argument that applies to a push — and because
# the trigger is part of the group, this still cannot touch the nightly. Measured the hard way:
# a stale dispatch on a superseded commit held runners for twenty minutes while the run that
# mattered queued behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # **The supply-chain gate this repo had none of.**
  #
  # A tool whose pitch is "be careful what gets installed on your machine" shipped 448 unaudited
  # transitive dependencies — `ring` and `reqwest` among them — with no mechanism that would ever
  # tell it about a RUSTSEC advisory. First in the file and first to run, because a dependency
  # with a known hole is a fact about every job below it.
  #
  # Split from `build` deliberately: it needs no matrix, no target and no test binaries, so
  # putting it in `build` would make one Linux answer wait on four platforms' worth of linking.
  supply-chain:
    name: Advisories and licences
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - name: cargo-deny
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        # `deny.toml` says what each of these means. `bans` is `warn`-level there rather than
        # `deny`, because duplicate versions in a 380-crate tree are usually somebody else's
        # choice and a gate that gets exempted into uselessness is not a gate.
        command: check advisories bans licenses sources

  # `rust-version` in `Cargo.toml` is a promise to a contributor on a distro-packaged Rust, and a
  # promise nothing checks is prose. It was typed as `1.82` on the first attempt and was wrong:
  # `std::fs::File::unlock` in `core/executor.rs` did not stabilise until `1.89`, so the declared
  # floor named a toolchain the tree does not compile on. Clippy's `incompatible_msrv` caught it
  # locally; this is what catches the next one.
  #
  # **The version is read from `Cargo.toml`, not typed here.** A second copy of the number in this
  # file would be free to disagree with the first, which is the whole failure this job exists to
  # end. `cargo check --all-targets` and not `test`: the question is whether the toolchain can
  # compile the tree, and the test *run* is every other job's business.
  msrv:
    name: Builds on the declared MSRV
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - id: msrv
      run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.msrv.outputs.version }}
    - run: cargo check --all-targets --locked

  # **The linter two files were already writing directives for.** `docker/integration/run.sh` and
  # `scripts/harness-mutation-test.sh` each carry a `# shellcheck disable=SC2086`, which is a
  # suppression addressed to a tool nothing in this repository ran — so the two lines were
  # decoration and every other shell defect in eleven scripts was unmeasured. The harnesses that
  # decide pass/fail for every backend are shell; a quoting bug in one of them is a wrong verdict.
  #
  # `-S warning` rather than the default `style`: this is a gate being switched on over existing
  # code, and a gate that arrives red on cosmetics is a gate somebody disables in week one.
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: shellcheck
      # `.githooks/*` is named rather than globbed by extension because a git hook may not have
      # one, which is the only reason it went unlinted when it was added.
      run: |
        shopt -s globstar nullglob
        shellcheck -S warning scripts/*.sh docker/**/*.sh .githooks/*

  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One row per *target*, not per runner. It was `os: [...]` crossed with an `include:`
      # that mapped each OS to a single target, which made `aarch64-apple-darwin`
      # unexpressible — so the Mac leg built only x86_64 and **every Mac sold since 2020 had
      # no published binary**. Masked because `scripts/install.*` builds from source, which
      # means the three published binaries were installed by nothing.
      #
      # Named by target because two rows now share `macos`, and **both build on arm64**.
      #
      # `macos-13` was the last Intel image and GitHub has retired it. A job asking for a label
      # with no runner behind it does not fail — it queues, silently, for ever: measured
      # 2026-08-10 at 83 minutes and still waiting, in a run where the arm64 Mac beside it
      # started in three seconds. `Create Release` needs all four builds, so the release could
      # not be cut and nothing said why. Apple Silicon cross-compiles to x86_64 natively, so the
      # target still ships; what it loses is a native test run, which `native: true` below marks
      # honestly rather than pretending the cross build was exercised.
      #
      # **Every row carries its own `rust`, and there is no base matrix.** With `rust: [stable]`
      # above the `include:`, the matrix had exactly ONE combination, and GitHub merges an
      # include entry into an existing combination when it overwrites none of the base values —
      # so all four rows merged into that same job in turn and the last one won. Measured, not
      # reasoned: three consecutive runs produced a single `Build for x86_64-pc-windows-msvc`
      # and no others. Linux and both Macs were never built here at all, while the release job
      # below asserts four binaries in `dist/` — the same shape as the assets that were all
      # named `shall`, and found the same way, by reading what the run actually did.
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust: stable
            native: true
          # **The most obvious gap in the release until now**: every arm64 Linux box — a Pi, a
          # Graviton instance, an arm64 container — fell through to `install.sh`'s source build,
          # which is 448 crates under fat LTO on hardware chosen for its power draw.
          #
          # Cross-compiled from x86_64 rather than built on an arm64 runner, deliberately. A
          # runner label with nothing behind it queues silently for ever instead of failing
          # (`S86`, measured at 83 minutes), so a row that needs a label this workflow has never
          # used is a row that can stall the release with no error to read. A cross build either
          # compiles or goes red, and `native: false` says plainly that its tests did not run.
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            rust: stable
            native: false
          # **The distros where a `-gnu` binary cannot start at all.** A dynamically linked
          # glibc binary hard-codes `/lib64/ld-linux-x86-64.so.2` as its interpreter, and
          # neither NixOS nor Alpine has one — measured 2026-08-16 by mounting Ubuntu's own
          # `/bin/echo` into `nixos/nix` (exit 127, *"cannot execute: required file not
          # found"*) and into `alpine:3.20` (*"not found"*, on a file plainly there). Alpine is
          # in this workflow's own integration matrix, so that was a supported platform whose
          # published binary could never have run.
          #
          # A static musl build has no interpreter to miss. One artifact, measured on all
          # three: `shall 0.8.0` from nixos/nix, alpine:3.20 and ubuntu:24.04 alike.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            rust: stable
            native: false
          - os: macos-latest
            target: x86_64-apple-darwin
            rust: stable
            native: false
          - os: macos-latest
            target: aarch64-apple-darwin
            rust: stable
            native: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust: stable
            native: true

    # **Fat LTO and one codegen unit are settings for a binary somebody downloads, not for a
    # gate.** `codegen-units = 1` forbids parallel codegen by definition, so this job cannot use
    # the runner's other cores however many it has, and it was 24 minutes against 12 for the
    # slowest container leg — the whole critical path, in one job, alone. A gate that takes half
    # an hour is a gate people stop reading.
    #
    # What this job proves is that the tree compiles for the target and its tests pass there, and
    # thin LTO proves exactly that. A tag build keeps the full settings, because that artifact is
    # the one that runs on somebody's machine.
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ startsWith(github.ref, 'refs/tags/v') && 'fat' || 'thin' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '16' }}

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        targets: ${{ matrix.target }}
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        # `matrix.target` is in the key because it is in the path on the very next line.
        # Without it the two Apple targets share one entry — and now that both build on
        # `macos-latest` they would collide on `runner.os` alone — and `actions/cache` does not
        # save on an exact-key hit, so whichever loses the race rebuilds cold on every run,
        # permanently.
        key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    # `mlua` is vendored and `ring` ships assembly, so this target needs a C cross toolchain and
    # not only a Rust one — `rustup target add` alone links against the host's libc and fails at
    # the last step of a ten-minute build.
    - name: Cross toolchain for aarch64 Linux
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        {
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
        } >> "$GITHUB_ENV"
      if: matrix.target == 'aarch64-unknown-linux-gnu'

    # Same reasoning as the row above: `rustup target add` alone links against the host's glibc
    # and dies at the last step. `mlua` vendors Lua, and `xz2`/`zstd` vendor C, so musl needs a
    # C compiler of its own. Verified in `rust:1-slim` before this row was written — the build
    # is clean and needs no source change.
    - name: Cross toolchain for musl
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools musl-dev
        {
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc"
          echo "CC_x86_64_unknown_linux_musl=musl-gcc"
        } >> "$GITHUB_ENV"
      if: matrix.target == 'x86_64-unknown-linux-musl'

    - name: Build
      run: cargo build --release --target ${{ matrix.target }}

    # `--no-fail-fast` because cargo stops at the first test TARGET that fails, and this suite has
    # dozens. Run 30503630610 reported exactly one failing target per OS and never ran the rest —
    # three findings visible and the remainder of the suite unmeasured on every platform, at 45
    # minutes a dispatch to learn the next one.
    #
    # Skipped for the one target this matrix cross-compiles. An x86_64 test binary needs Rosetta
    # to run on an arm64 runner, and a step that MIGHT be translated is worse than one that is
    # honestly absent: it reports green whether it ran the suite or a stub. The step below says
    # so in the job log, because a skip nobody is told about is the same silence that let this
    # matrix build one target of four.
    - name: Run tests
      run: cargo test --release --target ${{ matrix.target }} --no-fail-fast
      if: matrix.native

    - name: Tests for this target run elsewhere
      run: |
        echo "${{ matrix.target }} is cross-compiled from $(uname -m) and its tests are NOT run here."
        echo "The suite for this OS runs on the aarch64-apple-darwin row: same source, same tests,"
        echo "same OS, different instruction set. Only codegen is unexercised."
      if: ${{ !matrix.native }}

    # The blind spot every other gate in this file shares: builds, tests, clippy and all four
    # container lifecycles run with pipes on every handle, so none of them can see what Shall
    # does when a human is at a terminal — which is where a defect sat that emptied the output
    # of every command Shall runs. `cargo test` already includes this file; it is named as its
    # own step so a regression is legible in the job list instead of buried in 1,300 results.
    # Quoted, and it has to be: a module filter ends in `::`, which YAML reads as a mapping key
    # and refuses. An unparseable workflow does not fail a job — it fails the *run*, in zero
    # seconds, with no job to open and no log to read, so ten commits landed on a CI that had
    # never executed a step. Every `run:` whose value ends in a colon needs these quotes.
    - name: Terminal (pty) behaviour
      run: "cargo test --release --target ${{ matrix.target }} --test suite pty_tests::"
      if: matrix.target == 'x86_64-unknown-linux-gnu'

    # The numbers this commit measured, where a person can read them.
    #
    # The overlap ratio, the child count, the summed child time and the wave count are computed
    # on every `--timings` run and asserted by `the_fan_out_commands_still_fan_out`, which put
    # them in front of a human only when it went red — the run where a diff is least useful. So
    # the grade doc's *"the numbers recorded per commit and compared"* was half built: recorded,
    # never delivered.
    #
    # Delivered rather than ratcheted, and that is the ruling rather than an omission. A
    # wall-clock ratchet has to be tight enough to catch a doubling, and this file's own
    # measurement says a budget that tight goes red on a loaded runner — `run_timed_floor` takes
    # the best of three for exactly that reason. The gates stay shape-based, which cannot flake;
    # the trend is a person diffing two summaries.
    #
    # `|| true` because a missing line must not fail the build: the fan-out test skips loudly on
    # a runner with too few managers, and its skip line carries the same prefix.
    - name: Record this commit's fan-out shape
      if: ${{ !cancelled() && matrix.native }}
      # `grep`, `sed` and `||` are bash, and one of the native rows is a Windows runner whose
      # default shell is pwsh. The steps around this one are bare `cargo` lines that parse in
      # both, which is why none of them needed to say so.
      shell: bash
      run: |
        cargo test --release --target ${{ matrix.target }} --test suite \
          the_fan_out_commands_still_fan_out -- --nocapture 2>&1 \
          | grep -E '^latency shape:' \
          | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true

    - name: Check formatting
      run: cargo fmt -- --check
      if: matrix.target == 'x86_64-unknown-linux-gnu'

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    # The integration harnesses decide pass/fail for every backend, and they only run
    # nightly — so a wrong verdict inside one of them is a day late and easy to read
    # past. Their predicates are cheap to test directly, so they are tested on every push.
    # SHALL_BIN also lets it check that every subcommand the harnesses invoke still
    # exists: six of them had been folded into `check <section>` and the host harness
    # was never updated, which silently emptied two whole sections of that sweep.
    - name: Harness predicates
      run: SHALL_BIN="$PWD/target/${{ matrix.target }}/release/shall" bash scripts/harness-logic-test.sh
      if: matrix.target == 'x86_64-unknown-linux-gnu'

    - name: Upload binary artifact
      uses: actions/upload-artifact@v7
      with:
        name: shall-${{ matrix.target }}
        path: |
          target/${{ matrix.target }}/release/shall
          target/${{ matrix.target }}/release/shall.exe
        if-no-files-found: ignore

  # **This job had never run, and could not have.** Its publish step is gated on a `v*` tag, and
  # until the `tags:` line at the top of this file was added the workflow did not start on a tag
  # push at all — so the one step between a green build and a user downloading a binary was
  # unreachable by the event it waits for. `install.sh` falls back to compiling 448 crates on a
  # stranger's laptop precisely because there is nothing here to download yet.
  #
  # `workflow_dispatch` gives it a rehearsal: dispatched, it downloads the same artifacts, asserts
  # the same files are present, and stops without publishing. Tagged, it publishes. One job, one
  # path, and the difference is a single `if`.
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v7

    - name: Download all artifacts
      uses: actions/download-artifact@v8

    # **A release asset is named by its basename, and every build target produces `shall`.**
    # Four artifact directories carrying one filename between them upload as one asset that
    # three of the four overwrite — a release page offering a single `shall` binary with no way
    # to tell which platform won. The name has to carry the target before anything is published,
    # and it has to be the name the installers ask for.
    - name: Name each binary after the target it was built for
      run: |
        set -eu
        mkdir -p dist
        for d in shall-*/; do
          target=${d%/}; target=${target#shall-}
          if [ -f "${d}shall.exe" ]; then
            cp "${d}shall.exe" "dist/shall-${target}.exe"
          else
            cp "${d}shall" "dist/shall-${target}"
            chmod +x "dist/shall-${target}"
          fi
        done
        ls -l dist

    # The assertion the tagged path never makes because `action-gh-release` fails on its own if
    # the glob is empty — by which point the tag exists and the release is half-made. Here it is
    # a check, before anything is published, on every dispatch.
    #
    # One per matrix row, by name. A count alone passed when two Apple targets collided into one
    # file, which is the failure this job actually had.
    - name: The binaries the release would publish are present
      run: |
        set -eu
        missing=
        for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-unknown-linux-musl x86_64-apple-darwin aarch64-apple-darwin; do
          test -f "dist/shall-${target}" || missing="${missing} shall-${target}"
        done
        test -f dist/shall-x86_64-pc-windows-msvc.exe || missing="${missing} shall-x86_64-pc-windows-msvc.exe"
        test -z "$missing" || { echo "the release is missing:${missing}" >&2; exit 1; }
        echo "all six targets present"

    # `@v2`, not `@v1`. `actionlint` reports that v1's runner is too old for GitHub Actions —
    # it pins Node 16, which was removed — so the step that publishes the binaries would fail on
    # the one run nobody rehearses: a tag push. This job's whole history is that shape. The
    # release was already impossible twice, once because the workflow did not listen for tag
    # pushes at all and once because the Mac leg queued for a retired runner label, and both were
    # invisible until somebody pushed a tag.
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Dry run - nothing published
      if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
      run: echo "artifacts verified; push a v* tag to publish them."

  # The real integration matrix (IV.2): the fast half runs on every change, so a change that
  # breaks a manager's install/list/remove is caught here and not months later on someone's
  # machine. The slow images (tools, gentoo) build for tens of minutes and would teach people
  # to skip the gate, so they run only on manual dispatch.
  containers:
    name: Integration (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu,   backend: apt,    pkg: jq }
          - { distro: fedora,   backend: dnf,    pkg: jq }
          - { distro: alpine,   backend: apk,    pkg: jq }
          - { distro: arch,     backend: pacman, pkg: jq }
          # `zypper` and `xbps` were registered backends with no real lifecycle in ANY harness
          # and no stated reason for it — two of the twelve `Q4` counts as a release blocker.
          # They are in the fast matrix and not the nightly one on purpose: an image that runs
          # only when someone remembers it closes nothing.
          - { distro: opensuse, backend: zypper, pkg: jq }
          - { distro: void,     backend: xbps,   pkg: jq }
    steps:
    - uses: actions/checkout@v7
    - name: Build the ${{ matrix.distro }} image
      run: docker build -f docker/integration/Dockerfile.${{ matrix.distro }} -t shall-it-${{ matrix.distro }} .
    - name: Run the ${{ matrix.distro }} lifecycle
      run: |
        docker run --rm \
          -v "$PWD/docker/integration/run-in-container.sh:/src/docker/integration/run-in-container.sh:ro" \
          -v "$PWD/scripts/lifecycle-floor.txt:/src/scripts/lifecycle-floor.txt:ro" \
          shall-it-${{ matrix.distro }} ${{ matrix.backend }} ${{ matrix.pkg }}

    # **The argv probe, on every image rather than on one of six.**
    #
    # It was gated to the `tools` image, in the nightly job — so five distro images that each
    # carry a Rust toolchain, and between them `pacman`, `zypper`, `apk`, `xbps-install`,
    # `xbps-query`, `xbps-remove`, `pnpm`, `yarn` and `cargo`, never ran it. Those rows sat as
    # `Unasked` inferences, counted against `UNASKED_CEILING`, on images that could have
    # answered on every push. The evidence was being left on the floor.
    #
    # `!cancelled()` for the same reason as its twin in the nightly job: this and the lifecycle
    # are separate questions about the same image, and a step that runs only after a green step
    # cannot answer its own question on a red day.
    #
    # The ceiling comes down when these runs report, not before — a row says what the tool
    # *said*, and an inference confirmed by somebody else's run is still an inference here.
    # `-u 0`, and it is not a leftover. The arch image now runs its harness as an unprivileged
    # user, because that is the only way to drive `yay` and `paru` at all — and this probe reads
    # what a manager SAYS about an operand, which a manager that refuses before parsing one never
    # says. Measured on that image, both ways: as root it measures seven binaries, as `shall` it
    # measures six, and the missing one is `pacman` — whose row says `Measured` on the strength of
    # this leg. The AUR helpers answer either way; pacman does not. So the lifecycle wants the
    # user and the probe wants root, and they are separate runs of separate questions rather than
    # one compromise that half-answers both.
    - name: Ask this image's managers about subcommands, flags and `--`
      if: ${{ !cancelled() }}
      run: |
        docker run --rm -u 0 --entrypoint sh \
          -e TERMINATOR_PROBE=1 -e CARGO_TARGET_DIR=/tmp/target \
          -v "$PWD:/src" \
          shall-it-${{ matrix.distro }} -c \
          "cd /src && cargo test --test suite -- argv_drift_tests:: terminator_probe_tests:: --nocapture"

    # The container harness runs four distros on every push and nothing ever asked whether its
    # checks CAN fail — the mutation gate was pointed only at the Windows harness. It runs here,
    # on the ubuntu leg, because this is where the image already exists: a job of its own would
    # rebuild it for no other reason. The budget is the measured number (92 survivors of 136
    # checks, 44 caught) and is a ratchet like the other one — it may fall, never rise. It lives
    # in harness-mutation-test.sh beside the harness it measures, not here: while it was an -e
    # flag on this one step, the script's own documented invocation failed on a clean tree and
    # the container harness was mutation-tested in exactly one place.
    - name: Can this harness's checks fail?
      if: matrix.distro == 'ubuntu'
      run: |
        docker run --rm --entrypoint sh \
          -v "$PWD/docker/integration/run-in-container.sh:/src/docker/integration/run-in-container.sh:ro" \
          -v "$PWD/scripts/lifecycle-floor.txt:/src/scripts/lifecycle-floor.txt:ro" \
          -v "$PWD/scripts/harness-mutation-test.sh:/src/scripts/harness-mutation-test.sh:ro" \
          shall-it-ubuntu -c \
          "cd /src && bash scripts/harness-mutation-test.sh docker/integration/run-in-container.sh --check ${{ matrix.backend }} ${{ matrix.pkg }}"

  # The source-building images. `tools` is where 18 of the ecosystem managers get a real
  # install → list → remove — the widest live coverage this repo has — and `gentoo` runs
  # Portage in SMOKE_ONLY. Both are too slow to gate every push, so they run nightly and on
  # manual dispatch. Nightly and not never: dispatch-only meant the broad coverage existed
  # and was not consulted, which is indistinguishable from not having it.
  slow-containers:
    name: Integration (${{ matrix.distro }}, nightly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # `probe` is how this image is asked the argv questions, and it is a matrix field
          # because one image cannot be asked the way the others are. Everything here compiles
          # the suite in place; `guix`'s runtime stage is `metacall/guix`, which has no `cargo`
          # (measured), so its Dockerfile copies a prebuilt `suite` binary out of the builder and
          # this drives that instead. The step concatenates `probe` with the test filters, which
          # is why the cargo form carries its own trailing `--`.
          - { distro: tools,     backend: apt,      pkg: jq, flags: '', probe: 'cargo test --test suite --' }
          - { distro: gentoo,    backend: emerge,   pkg: jq, flags: '-e SMOKE_ONLY=1', probe: 'cargo test --test suite --' }
          # Slackware is here rather than in the fast matrix for the reason gentoo is: the
          # image builds for tens of minutes. `slackpkg` had never met its own manager in any
          # harness before 2026-08-14 — it was argv-tested only, with no image to run it in.
          #
          # The canary is `bc`, not `jq`: Slackware's package set has no jq at all, and a
          # canary the mirror does not carry reads as a broken backend rather than a missing
          # package. `bc` is in the `ap` series, which this image deliberately does not
          # install — the first canary tried was `wget`, which the image DOES ship, so the
          # PATH assertion was vacuous, and worse, slackpkg shells out to `wget`, so removing
          # it broke the manager for every check after it (13 failures from one canary).
          - { distro: slackware, backend: slackpkg, pkg: bc, flags: '', probe: 'cargo test --test suite --' }
          # And the image the `flags` slot was renamed for. `guix` needs
          # `--security-opt seccomp=unconfined` because its build sandbox calls `personality(2)`
          # and Docker's default profile blocks it — without which every install dies as
          # *"in phase setPersonality: cannot set personality"*, which reads like a broken
          # manager rather than a syscall filter.
          #
          # The canary is `hello`: a guix profile starts empty, so the canary is whatever has a
          # prebuilt substitute in guix's own cache, and `hello` is the smallest such thing. A
          # source build here would be the whole nightly.
          # And its `probe` starts the daemon first. The probe step passes `--entrypoint sh`, so
          # the entrypoint that normally starts `guix-daemon` does not run — every guix verb then
          # died on "failed to connect to /var/guix/daemon-socket/socket" before parsing an
          # operand, and the leg measured `apt` instead of the manager it exists for.
          - { distro: guix,      backend: guix,     pkg: hello, flags: '--security-opt seccomp=unconfined', probe: 'sh /usr/local/bin/guix-daemon-up && suite' }
    steps:
    - uses: actions/checkout@v7
    - name: Build the ${{ matrix.distro }} image
      run: docker build -f docker/integration/Dockerfile.${{ matrix.distro }} -t shall-it-${{ matrix.distro }} .
    - name: Run the ${{ matrix.distro }} lifecycle
      # `flags` rather than `smoke`: it was already a raw `docker run` flag string carrying
      # `-e SMOKE_ONLY=1`, and the next image to need this slot needs it for a security option
      # rather than a run mode. A key named for one of its values is a key that gets a second
      # one bolted on with the wrong name.
      run: |
        docker run --rm ${{ matrix.flags }} \
          -v "$PWD/docker/integration/run-in-container.sh:/src/docker/integration/run-in-container.sh:ro" \
          -v "$PWD/scripts/lifecycle-floor.txt:/src/scripts/lifecycle-floor.txt:ro" \
          shall-it-${{ matrix.distro }} ${{ matrix.backend }} ${{ matrix.pkg }}

    # The argv gates, run where the managers are. Both of them can only ask a manager that is
    # present, and a GitHub runner has about eight — this image has thirty. That gap is the
    # whole reason `luarocks`, `mix` and `asdf` went years without anyone asking them a
    # question: not that the gates were missing, but that they had never been pointed at a
    # machine that could answer. The image already carries a Rust toolchain.
    #
    # **Runs even when the lifecycle above it failed.** They are separate questions asked of the
    # same image — "does an install→list→remove still work" and "do these tools still parse the
    # argv we build" — and a step that only runs after a green step cannot answer its own
    # question on a red day. A composer finding sat unmeasured for a full day because a
    # coverage ratchet three steps earlier had gone red over an unrelated manager. The job still
    # fails; the difference is that the failing run now reports both answers instead of one.
    # **`matrix.flags` belongs here too, and leaving it off was a leg that could not answer.**
    # The flags are what an image needs to run *at all*, not what its lifecycle needs: guix's
    # `--security-opt seccomp=unconfined` is a syscall filter, and an image whose manager dies on
    # a blocked `personality(2)` reports its rows unmeasurable rather than measuring them. A slot
    # named for the run and consulted by one of the run's two steps is half a slot.
    - name: Ask this image's thirty managers about subcommands, flags and `--`
      if: ${{ !cancelled() }}
      run: |
        docker run --rm ${{ matrix.flags }} --entrypoint sh \
          -e TERMINATOR_PROBE=1 -e CARGO_TARGET_DIR=/tmp/target \
          -v "$PWD:/src" \
          shall-it-${{ matrix.distro }} -c \
          "cd /src && ${{ matrix.probe }} argv_drift_tests:: terminator_probe_tests:: --nocapture"

  # The storage effectors, on real block devices. `btrfs`, `lvm` and `zfs` operate on volumes
  # and cannot be exercised by any amount of mocking; before 2026-07-30 none of them had ever
  # been run at all. This is the only job that gets `--privileged`, and the only one that needs
  # the host's `/lib/modules` — a container borrows the host's kernel but not its module files,
  # so `modprobe btrfs` inside one otherwise fails on a kernel that has btrfs.
  #
  # **On every push since 2026-07-31, and it was nightly-and-deliberately-RED before that.**
  # `lvm:` requires `@size`, II.2's option table did not permit it, and the canary written the
  # way Part II said it should be failed by name every run — a finding held in the harness rather
  # than hidden by editing the test. `Q18` ruled the table wrong, the option is legal on the
  # backends that read it, and this job's own instruction was to promote it here the moment that
  # happened. `btrfs`'s canary now also carries `@quota` and `@mount`, so the code that writes
  # /etc/fstab runs on a real filesystem rather than being legal on paper.
  #
  # A leg of `containers` would be tidier and cannot work: this is the only job that needs
  # `--privileged` and the host's `/lib/modules`, and a matrix cannot vary `docker run` flags.
  storage:
    name: Integration (storage — btrfs/lvm/zfs on loopback devices)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build the storage image
      run: docker build -f docker/integration/Dockerfile.storage -t shall-it-storage .
    - name: Run the storage lifecycle
      run: |
        docker run --rm --privileged \
          -v /lib/modules:/lib/modules:ro \
          -v "$PWD/docker/integration/run-in-container.sh:/src/docker/integration/run-in-container.sh:ro" \
          -v "$PWD/scripts/lifecycle-floor.txt:/src/scripts/lifecycle-floor.txt:ro" \
          shall-it-storage apt jq

    # **The one image with `btrfs`, `lvm` and `zfs` on it had never been asked an argv question.**
    # `scripts/terminator-floor.txt` listed `container-storage` among the classes owing a line, on
    # the assumption that every class prints one on its next run. This job printed nothing, because
    # nothing here ever pointed the probe at this image — the probe runs in the container matrix
    # and the nightly one, and storage is neither. A class that no job asks is not a gap waiting on
    # a run; it is a gap waiting on a step, and it would have waited indefinitely.
    #
    # **It does NOT reach `btrfs`, `lvm` or `zfs`, which is why the step was worth adding but not
    # for the reason it was added.** The first run measured `container-storage apt cargo` and
    # nothing else. Those three binaries have no row in `TERMINATORS` at all, so the probe has
    # nothing to ask about them — and this step is what turned that from an assumption into a
    # measurement. The absence is not itself a defect: the table's default is "does not
    # terminate", which is the safe answer, and these tools take a path or a `VG/LV` positionally.
    # It is an unmeasured area with a name on it now, which is the whole business of the floor
    # file.
    #
    # `--privileged` and `/lib/modules` as above: the probe drives the same binaries the lifecycle
    # does, and a `zfs` that cannot load its module answers differently from one that can.
    - name: Ask the storage image's managers about subcommands, flags and `--`
      if: ${{ !cancelled() }}
      run: |
        docker run --rm --privileged --entrypoint sh \
          -e TERMINATOR_PROBE=1 -e CARGO_TARGET_DIR=/tmp/target \
          -v /lib/modules:/lib/modules:ro \
          -v "$PWD:/src" \
          shall-it-storage -c \
          "cd /src && cargo test --test suite -- argv_drift_tests:: terminator_probe_tests:: --nocapture"

  # macOS, run rather than compiled. A Darwin build passing `cargo test` says the code
  # compiles there; it says nothing about whether `brew install` reaches brew, whether the
  # parser reads `brew list --versions`, or whether a removal comes back. This is the same
  # sweep `release-check.sh` runs on a Mac, on the runner instead of on hardware nobody has.
  #
  # Nightly and dispatch, not every push: it has never run, and a job whose first execution
  # gates other people's commits is a job that gets disabled rather than fixed. Promote it to
  # `containers`' schedule once it has been green a few nights.
  macos-native:
    name: Integration (macOS native, nightly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --release
    # The sweep bounds every command it runs, and macOS ships no `timeout`. It degrades
    # to unbounded and says so, but unbounded on a hosted runner means a wedged command
    # burns the job's whole clock — so give it the real thing.
    - name: Install coreutils (gtimeout)
      run: brew install coreutils
    - name: Native sweep (brew)
      run: SHALL="$PWD/target/release/shall" bash scripts/integration-windows.sh brew wget

  # The native Windows sweep — the gate that found every hard failure in the 2026-07-27
  # readiness assessment, and which no automated job ran on any platform. `release-check.ps1`
  # is developer-invoked, so its section 12 (a real install/list/PATH/remove lifecycle for
  # every user-scoped manager on the host) executed only when somebody remembered to.
  #
  # Nightly rather than per-push for the reason the other slow jobs are: it installs and
  # removes real packages and takes minutes. Nightly is not "when someone presses a button".
  windows-native:
    name: Integration (Windows native, nightly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - name: Build
      run: cargo build --release
    - name: Install scoop (the default backend for this sweep)
      shell: powershell
      run: |
        Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
        irm get.scoop.sh -outfile install.ps1
        .\install.ps1 -RunAsAdmin
        echo "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    - name: Native sweep (scoop)
      shell: bash
      run: SHALL="$PWD/target/release/shall.exe" bash scripts/integration-windows.sh scoop jq

  # Does every subcommand Shall invokes still exist in the tool it invokes it on?
  #
  # `pixi global upgrade-all` was removed upstream and sat in the tree for as long as it did
  # because a plan-smoke proves an argv was *constructed*, never that it is *correct*. This
  # asks the managers themselves, so silent upstream drift becomes a named failure. It only
  # sees managers installed on the runner, and it prints the ones it had to skip.
  argv-drift:
    name: Upstream argv drift (nightly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - name: Ask every installed manager whether it still has these subcommands
      run: "cargo test --release --test suite -- argv_drift_tests:: --nocapture"

    # The same question one layer down: not "does this subcommand exist" but "does `--` still
    # mean options-end-here to this parser". Four rows of that table have been wrong, each one
    # added by someone who recognised the family, and each one broke every install that went
    # through it. These runners carry apt/dpkg (ubuntu), brew (macos) and winget/choco
    # (windows), so seven rows get asked here for the price of a job that already exists.
    - name: Ask them whether `--` still ends their options
      env:
        TERMINATOR_PROBE: '1'
      run: "cargo test --release --test suite -- terminator_probe_tests:: --nocapture"

  # A harness is trustworthy because its checks CAN go red, not because they are green. This
  # replaces `shall` with a binary that does nothing and exits 0: every check that still
  # passes examined nothing. The survivor count is a ratchet — it may fall, never rise.
  # **The front door, actually opened.**
  #
  # `scripts/install.sh` is the line the README tells every new user to pipe into a shell, and
  # until this job nothing in the repository had ever RUN it. It was scanned for command names by
  # `named_commands_exist_tests` and syntax-checked by `shellcheck`, both of which read the file
  # without executing a line of it — so 207 lines of platform detection, release download and
  # source-build fallback were the least-exercised code here and the most-used.
  #
  # A clean `debian:stable-slim` with nothing this project put there, which is closer to a new
  # user's machine than any image in the integration matrix.
  #
  # **`SHALL_REF` is the BRANCH, and it took a real branch to find out that was not supported.**
  # This comment used to assert that `github.ref_name` "is a ref `--tag`'s sibling resolution
  # accepts". It is not: both scripts turned any `SHALL_REF` into `--tag <ref>`, and libgit2
  # answers `refs/remotes/origin/tags/main` NotFound. The scripts now ask the remote which of the
  # two a ref is and pass `--tag` or `--branch` accordingly, so `SHALL_REF=main` — the example
  # written in `install.sh` itself — does what it says. A sha is still neither, which is why this
  # is not `github.sha`.
  #
  # Nightly, because with no release tagged the script correctly falls through to a source build
  # of 448 crates. That fall-through is not a detour to be mocked out — it is what every user who
  # runs this line today actually gets, so it is what gets tested.
  install-script:
    name: The install script, run for real (nightly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    # **Both sides of the one fork this script has, because testing one of them tested neither.**
    # `install.sh` asks `command -v cargo` and takes one of two paths. This job built a container
    # with no Rust in it and then asserted that a binary appeared, so it was asserting the
    # success path in an environment that can only produce the refusal — and it failed on the
    # script behaving exactly as designed. The refusal is a real outcome a real user gets, so it
    # is checked rather than engineered away, and then Rust is installed and the source build is
    # checked too.
    - name: With no Rust, install.sh refuses and says where to get it
      run: |
        docker run --rm -v "$PWD:/src:ro" -e SHALL_REF="${{ github.ref_name }}" debian:stable-slim sh -c '
          apt-get update -qq >/dev/null
          apt-get install -y -qq curl ca-certificates git >/dev/null
          out=$(sh /src/scripts/install.sh 2>&1); rc=$?
          echo "$out"
          # **Which fork this run took is read from the script, not assumed.** The refusal only
          # applies when no published binary matched — the day a `v*` tag exists, this container
          # downloads one and never reaches the cargo check, and an unconditional "expect exit 1"
          # would then fail on the script working. That assumption is exactly what the step below
          # got wrong in the other direction.
          if echo "$out" | grep -q "no published binary"; then
            [ "$rc" -eq 1 ] || { echo "no binary and no cargo, so expected exit 1; got $rc"; exit 1; }
            # The sentence, not just the code: a user who cannot install needs to be told the one
            # thing that would let them.
            echo "$out" | grep -q "rustup.rs" || { echo "the refusal does not say where to get Rust"; exit 1; }
          else
            echo "a published binary matched, so the no-Rust refusal is not the path under test."
            [ "$rc" -eq 0 ] || { echo "the download path exited $rc"; exit 1; }
            command -v shall >/dev/null || { echo "it reported a download and left no shall"; exit 1; }
          fi
        '

    # **`SHALL_NO_ADOPT` and the un-asserted exit code are both the twin's rules, arriving here
    # late.** `install.ps1`'s job has carried each with a comment for as long as it has existed:
    # the script's last acts are `shall check health`, which exits 2 by design when it finds work
    # (`U21`, `H2`), and an adopt prompt that blocks on a container with no TTY. This job had
    # neither, so the first run that got far enough to *succeed* at installing died at the prompt
    # and reported exit 2 — a green install read as a red job. Exactly the twin-that-diverged
    # shape `CLAUDE.md` is about, and the rule is in both jobs now.
    - name: Pipe install.sh into a clean container, as the README says to
      run: |
        docker run --rm -v "$PWD:/src:ro" \
          -e SHALL_REF="${{ github.ref_name }}" -e SHALL_NO_ADOPT=1 debian:stable-slim sh -c '
          set -e
          apt-get update -qq >/dev/null
          apt-get install -y -qq curl ca-certificates build-essential pkg-config libssl-dev git >/dev/null
          # The source-build path needs a toolchain, and the container has none. Installed here
          # rather than mocked: this is the path every user gets while no release is tagged, so
          # it is the path that has to compile.
          curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal >/dev/null
          . "$HOME/.cargo/env"
          # Deliberately not asserting on the exit code, for the reason the comment above gives.
          sh /src/scripts/install.sh || echo "install.sh exited $? — asserting on the artifact, not the code"
          # The assertion is not that the script exited 0 — it is that a user now has a working
          # program. A script that reports success and installs nothing is the exact failure
          # this job exists to catch.
          command -v shall || { echo "install.sh left no shall on PATH"; exit 1; }
          shall --version
        '

  # **The twin, and it needs its own job for the same reason the scripts are twins.**
  # `install.ps1` is 175 lines of the same shape written in a language where none of the Unix
  # job's evidence applies: a different download path, a different `--root` rule (cargo installs
  # into `<root>\bin`, so a `SHALL_BIN_DIR` is either that directory's parent or a staged copy),
  # and `$ErrorActionPreference = 'Stop'`, which has already turned one *optional* command into a
  # terminating error at a step that was only ever a preference.
  #
  # `SHALL_BIN_DIR` is set deliberately: it is the one variable whose Windows handling has no
  # counterpart in the twin, so the run that does not exercise it leaves the interesting half
  # untested. `SHALL_NO_ADOPT` because the script otherwise stops at a `Read-Host` prompt and the
  # job would time out rather than fail.
  install-script-windows:
    name: The Windows install script, run for real (nightly)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - name: Run install.ps1 as the README says to
      shell: pwsh
      env:
        SHALL_REF: ${{ github.ref_name }}
        SHALL_NO_ADOPT: "1"
      run: |
        $env:SHALL_BIN_DIR = Join-Path $env:RUNNER_TEMP 'shall-install-canary'
        & ./scripts/install.ps1
        # **Deliberately not asserting on the script's exit code.** Its last act is
        # `shall check health`, and a read-only command that finds work exits 2 by design (U21,
        # H2) — a machine with drift is the normal case, so an exit-code assertion here would
        # fail nightly on correct behaviour. The assertion is the artifact, same as the Unix
        # twin: not that it exited 0, but that a user now has a working program — and at the
        # path they asked for, which is the half only this job sees.
        $binary = Join-Path $env:SHALL_BIN_DIR 'shall.exe'
        if (-not (Test-Path $binary)) { throw "install.ps1 left no shall.exe in SHALL_BIN_DIR" }
        & $binary --version
        if ($LASTEXITCODE -ne 0) { throw "the installed binary does not run" }
  harness-mutation:
    name: Harness mutation (can the checks fail?)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - name: Stub the binary and count what still passes
      run: bash scripts/harness-mutation-test.sh --check

  # **And the OTHER mutation gate: the Rust suite's own.** The job above asks whether the shell
  # harness's checks can fail. Nothing asked that of the 1,800 lib tests, and on 2026-08-13
  # `cargo mutants` over `src/app/sync/guard.rs` answered: the guard's **OS-essential protection
  # could be deleted entirely** — `essential_names` replaced with `HashSet::new()` — with every
  # Rust test green AND all 425 container-harness checks green. A Linux binary carrying that
  # mutation planned removals for `tar`, `sed`, `grep`, `gzip` and `findutils` and the guard said
  # nothing. Only apt's own refusal to remove `Essential: yes` packages stopped the damage: a
  # second line of defence Shall does not own and cannot assume of every backend.
  #
  # **Nightly and over a named short list, not per change and not over the tree.** One file of
  # 125 mutants cost ~90 minutes; the whole tree is days. These four are the files where a silent
  # mutation is a safety failure rather than a wrong answer — the guard that refuses a removal,
  # the exit codes a script branches on, the lock that stops two Shalls writing at once, and the
  # transaction that decides whether a failed run gives a package back.
  #
  # `--test-tool=cargo` with no filter, deliberately: `--test suite <name>` runs the INTEGRATION
  # target only, and scoping it that way is what made the first run of this report eight missed
  # mutants out of eleven, including `GuardScope::reconciles` in both directions — a load-bearing
  # safety predicate that is in fact asserted for all twelve scopes by a **lib** test. A mutation
  # score is exactly as trustworthy as the claim that its test command represents the suite.
  # **One job per file, because all four in one job never finished.** The four were a single step
  # under `timeout-minutes: 360`, and the arithmetic in the comment above says why that could not
  # work: ~90 minutes for one file of 125 mutants, four files, one job. Runs 31771331606 and
  # 31821620442 both ended `cancelled` at six hours and two seconds — a gate that has never once
  # reported a result, which is worse than a gate nobody wrote, because the job list says it ran.
  #
  # Sharded by file rather than by `--shard k/n`: the files are the unit the comment reasons in,
  # each shard's name says which safety property it covers, and a file that grows past the limit
  # tells you which one it is instead of moving an anonymous fraction of the work.
  rust-mutation:
    name: Mutation (${{ matrix.what }}, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { what: the removal guard, file: src/app/sync/guard.rs, slug: guard }
          - { what: the exit codes, file: src/core/exit.rs, slug: exit }
          - { what: the data lock, file: src/core/datalock.rs, slug: datalock }
          - { what: the transaction, file: src/core/transaction.rs, slug: transaction }
    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Install cargo-mutants
      run: cargo install cargo-mutants --locked
    - name: Mutate ${{ matrix.file }}, where a silent mutation is a safety failure
      run: cargo mutants --no-shuffle -j2 --file ${{ matrix.file }} -- --no-fail-fast
    - name: The survivors, kept whether the run passed or failed
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: mutants-out-${{ matrix.slug }}
        path: mutants.out/
