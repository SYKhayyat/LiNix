name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        targets: ${{ matrix.target }}
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build
      run: cargo build --release --target ${{ matrix.target }}

    - name: Run tests
      run: cargo test --release --target ${{ matrix.target }}

    # Informational only: the existing codebase is not yet rustfmt-clean. Kept
    # non-blocking so it doesn't gate CI; remove continue-on-error once formatted.
    - name: Check formatting
      run: cargo fmt -- --check
      if: matrix.os == 'ubuntu-latest'
      continue-on-error: true

    - name: Run clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: linix-${{ matrix.target }}
        path: |
          target/${{ matrix.target }}/release/linix
          target/${{ matrix.target }}/release/linix.exe
        if-no-files-found: ignore

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v4
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          linix-*/linix
          linix-*/linix.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The real integration matrix (IV.2): the fast half runs on every change, so a change that
  # breaks a manager's install/list/remove is caught here and not months later on someone's
  # machine. The slow images (tools, gentoo) build for tens of minutes and would teach people
  # to skip the gate, so they run only on manual dispatch.
  containers:
    name: Integration (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu, backend: apt,    pkg: jq }
          - { distro: alpine, backend: apk,    pkg: jq }
          - { distro: arch,   backend: pacman, pkg: jq }
    steps:
    - uses: actions/checkout@v4
    - name: Build the ${{ matrix.distro }} image
      run: docker build -f docker/integration/Dockerfile.${{ matrix.distro }} -t linix-it-${{ matrix.distro }} .
    - name: Run the ${{ matrix.distro }} lifecycle
      run: |
        docker run --rm \
          -v "$PWD/docker/integration/run-in-container.sh:/src/docker/integration/run-in-container.sh:ro" \
          linix-it-${{ matrix.distro }} ${{ matrix.backend }} ${{ matrix.pkg }}

  # Opt-in: the source-building images. `tools` gives the ecosystem managers a real
  # install → list → remove; `gentoo` runs Portage in SMOKE_ONLY. Both are too slow to gate
  # every push, so they run on manual dispatch (Actions → CI → Run workflow).
  slow-containers:
    name: Integration (${{ matrix.distro }}, opt-in)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: tools,  backend: apt,    pkg: jq, smoke: '' }
          - { distro: gentoo, backend: emerge, pkg: jq, smoke: '-e SMOKE_ONLY=1' }
    steps:
    - uses: actions/checkout@v4
    - name: Build the ${{ matrix.distro }} image
      run: docker build -f docker/integration/Dockerfile.${{ matrix.distro }} -t linix-it-${{ matrix.distro }} .
    - name: Run the ${{ matrix.distro }} lifecycle
      run: |
        docker run --rm ${{ matrix.smoke }} \
          -v "$PWD/docker/integration/run-in-container.sh:/src/docker/integration/run-in-container.sh:ro" \
          linix-it-${{ matrix.distro }} ${{ matrix.backend }} ${{ matrix.pkg }}
