# Dependabot — the other half of the supply-chain gate.
#
# `deny.toml` fails the build when an advisory lands against something already in the tree.
# This is what proposes the upgrade that fixes it, and what keeps the tree from drifting so far
# behind that the fix is a rewrite.
#
# Weekly, grouped: 380 transitive dependencies opening individual pull requests is a stream
# nobody reads, and a gate nobody reads is a gate that does not exist — which is the failure this
# repo has already been caught by in `--help`, in `is_removal_call`, and in the mock's default.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine bumps, so the ones that need reading stand out.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
